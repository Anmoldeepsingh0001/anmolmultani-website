name: Refresh Instagram feed

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh long-lived access token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_SECRETS }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT_FOR_SECRETS not set — skipping auto-refresh (token will need manual renewal every ~60 days)."
            exit 0
          fi
          RESP=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_ACCESS_TOKEN}")
          NEW_TOKEN=$(python3 -c "import sys,json; print(json.loads('''$RESP''').get('access_token',''))" 2>/dev/null || true)
          if [ -n "$NEW_TOKEN" ]; then
            echo "Token refreshed successfully, updating repo secret."
            gh secret set IG_ACCESS_TOKEN --body "$NEW_TOKEN"
          else
            echo "Token refresh skipped or failed (may not be due yet) — continuing with existing token."
          fi

      - name: Fetch latest Instagram posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          curl -s "https://graph.instagram.com/me/media?fields=id,caption,media_type,media_url,permalink,thumbnail_url,timestamp&access_token=${IG_ACCESS_TOKEN}&limit=4" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps({'data': d.get('data', [])}))" > instagram-posts.json
          cat instagram-posts.json

      - name: Download thumbnails (Instagram's media URLs expire — self-host so the feed doesn't go stale between refreshes)
        run: |
          mkdir -p instagram-media
          rm -f instagram-media/*.jpg
          python3 <<'PY'
          import json, urllib.request

          data = json.load(open('instagram-posts.json'))
          posts = data.get('data', [])
          for p in posts:
              src = p.get('thumbnail_url') or p.get('media_url')
              if not src:
                  continue
              dest = f"instagram-media/{p['id']}.jpg"
              try:
                  req = urllib.request.Request(src, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=20) as r, open(dest, 'wb') as f:
                      f.write(r.read())
                  p['local_thumb'] = dest
              except Exception as e:
                  print(f"Failed to download thumbnail for {p['id']}: {e}")

          json.dump({'data': posts}, open('instagram-posts.json', 'w'))
          PY
          cat instagram-posts.json

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram-posts.json instagram-media
          git diff --cached --quiet || git commit -m "Auto-refresh Instagram feed [skip ci]"
          git push
