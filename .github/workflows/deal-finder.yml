name: Deal Finder price check

# Times are UTC. Atlantic time = UTC-4: 00:00/12:00 UTC = 8 pm / 8 am.
on:
  schedule:
    - cron: '0 0,12 * * *'    # every day, 8 am and 8 pm Atlantic
    - cron: '0 6,18 27 11 *'  # Black Friday extras (2 am, 2 pm) = every 6 hours that day
  workflow_dispatch:
    inputs:
      item:
        description: 'Item id to check (blank = all items)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: deal-finder-${{ github.event.inputs.item || 'all' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TZ: America/Halifax
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Search stores with Claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ITEM: ${{ github.event.inputs.item }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "CLAUDE_CODE_OAUTH_TOKEN secret not set"; exit 1; fi
          if [ -n "$ITEM" ]; then SCOPE="Only check item id '$ITEM'."; else SCOPE="Check ALL items."; fi
          claude -p "Read .github/deal-finder/CHECK.md and follow it. $SCOPE" \
            --allowedTools "WebSearch" "WebFetch" "Read" "Bash(python3 .github/deal-finder/deals.py:*)" \
            || echo "Claude run ended with an error; keeping whatever was recorded"

      - name: Email buy alerts
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python3 .github/deal-finder/send_alerts.py

      - name: Save prices and rebuild page data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deals/data/prices deals/data/alerts.json
          git diff --cached --quiet || git commit -m "Deal Finder: price check" --quiet
          for i in 1 2 3 4 5; do
            git pull --rebase --quiet || { git rebase --abort; sleep 10; continue; }
            python3 .github/deal-finder/deals.py summary
            git add deals/data/summary.json
            git diff --cached --quiet || git commit -m "Deal Finder: refresh summary" --quiet
            git push --quiet && exit 0
            sleep 10
          done
          exit 1
