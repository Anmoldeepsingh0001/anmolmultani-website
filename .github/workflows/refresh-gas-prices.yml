name: Refresh PEI gas prices

# Hourly (GitHub skips some scheduled runs when it's busy, so we ask often), plus
# extra tries right after IRAC usually posts (Mon/Thu afternoon) and just after the
# 12:01 a.m. Tuesday/Friday change. Times are UTC; Halifax is UTC-4 (UTC-3 in summer).
on:
  schedule:
    - cron: '7 * * * *'
    - cron: '37 19-23 * * 1,4'
    - cron: '37 4,5 * * 2,5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gas-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TZ: America/Halifax
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update prices and forecast
        run: python3 gas-data/scripts/gas_page.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gas-prices.json gas-data
          git diff --cached --quiet || git commit -m "Auto-refresh PEI gas prices"
          git pull --rebase --quiet || true
          git push
